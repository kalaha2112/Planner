<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- discourage HTML caching so refreshes always get the latest build -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Trip Planner</title>

  <!-- PWA: installable app (stripped from standalone.html — file:// can't register a SW) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Night Market type stack — Clash Display (from Fontshare) now carries both
       the display headings and the UI text, Bebas Neue the caps, Instrument Serif
       the italic date/sub lines. Weights 400-700: Clash Display has no 800, so the
       nine 800 rules resolve down to 700 by normal CSS weight matching, which is
       also why the weight lift stopped at 600 rather than flattening 600 into 700.
       Sora and Space Grotesk stay in the CSS fallback chains but are no longer
       downloaded — they only show if Fontshare is unreachable AND the machine
       happens to have them installed. Loaded async so fonts never block first
       paint; the service worker caches them for offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></noscript>
  <noscript><link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet"></noscript>

  <!-- Leaflet (interactive route map) — vendored locally so it loads without a CDN -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <!-- TopoJSON client + world atlas — vendored locally, inlined by build.js -->
  <script src="vendor/topojson/topojson.min.js"></script>
  <!-- Supabase JS client (vendored locally) — account sign-in + realtime cross-device sync -->
  <script src="vendor/supabase/supabase.js"></script>

  <!-- three.js (3D hero globe) — vendored locally, inlined by build.js.
       Pinned to r149, the last release shipping a UMD build, so it exposes a
       plain window.THREE and needs no import map or module plumbing (which
       file:// standalone.html could not resolve anyway). -->
  <script src="vendor/three/three.min.js"></script>
  <!-- GSAP + ScrollTrigger (scroll-driven motion) — vendored locally -->
  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/ScrollTrigger.min.js"></script>

  <!-- pre-paint theme boot: must run BEFORE styles apply so a saved dark
       theme never flashes light on load (kept out of the PWA blocks, which
       build.js strips from standalone.html) -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('europe-trip-theme-v1') === 'dark')
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
      // the short-lived ?skin= experiment is over — clear any saved value so an
      // old bookmark can't leave a stale attribute behind
      try { localStorage.removeItem('europe-trip-skin-v1'); } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=237">
</head>
<body>
  <main id="app"></main>
  <!-- SVG filter used by the day-plan map: dilates the white street lines so
       they read bolder (referenced from styles.css as url(#daymap-dilate)) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- app version. 0.75 was cut against CARTO's hairline streets; Esri's come
         in heavier already, and a phone rasterises the filter at its own pixel
         ratio, so on a 3x screen that radius grew each line by ~1.5 CSS px a
         side and the grid read as a bold white mesh. -->
    <filter id="daymap-dilate" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.3"/>
    </filter>
    <!-- web version: lighter grid so it doesn't crowd the street labels.
         Halved from 0.3 for the Esri basemap, whose street lines already come
         in heavier than CARTO's did — at 0.3 the dilate was compounding that
         rather than rescuing thin lines from the contrast step. -->
    <filter id="daymap-dilate-soft" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.15"/>
    </filter>
    <!-- light theme: the tone pass ends with invert(1), so by the time this
         runs the streets are the DARK pixels. Growing them is erode (minimum),
         not dilate (maximum) — same 0.75 as the app's dilate. -->
    <filter id="daymap-erode" color-interpolation-filters="sRGB">
      <feMorphology operator="erode" radius="0.3"/>
    </filter>
  </svg>
  <!-- shared-post extractor (RedNote / TikTok / Instagram → itinerary rows);
       loads before app.js, which calls window.SocialImport -->
  <script src="social-import.js?v=1"></script>
  <script src="app.js?v=210"></script>
  <!-- PWA: offline cache + install support (no-op on file:// and non-secure origins) -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      // Reload once when a NEW service worker takes control, so a fresh deploy
      // shows up without a manual refresh. Guarded so it never fires on the
      // first install (no prior controller) and never loops.
      const hadController = !!navigator.serviceWorker.controller;
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing || !hadController) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        // updateViaCache:'none' → sw.js is always fetched from the network, so a
        // bumped VERSION is detected on the next load (not up to 24h later).
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update();   // check for a newer worker right away
          // installed PWAs seldom reload on their own — re-check whenever the app is refocused
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
