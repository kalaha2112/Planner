<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- discourage HTML caching so refreshes always get the latest build -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Trip Planner</title>

  <!-- PWA: installable app (stripped from standalone.html — file:// can't register a SW) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e8e4dc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Type stacks for every skin — the classic editorial set plus the two
       candidate skins' families (see the SKINS block in styles.css). Loaded
       async so fonts never block first paint. Trim to the winning skin's
       families once a direction is chosen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@700&family=Jost:ital,wght@1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@700&family=Jost:ital,wght@1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@700&family=Jost:ital,wght@1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

  <!-- Leaflet (interactive route map) — vendored locally so it loads without a CDN -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <!-- TopoJSON client + world atlas — vendored locally, inlined by build.js -->
  <script src="vendor/topojson/topojson.min.js"></script>
  <!-- Supabase JS client (vendored locally) — account sign-in + realtime cross-device sync -->
  <script src="vendor/supabase/supabase.js"></script>

  <!-- three.js (3D hero globe) — vendored locally, inlined by build.js.
       Pinned to r149, the last release shipping a UMD build, so it exposes a
       plain window.THREE and needs no import map or module plumbing (which
       file:// standalone.html could not resolve anyway). -->
  <script src="vendor/three/three.min.js"></script>
  <!-- GSAP + ScrollTrigger (scroll-driven motion) — vendored locally -->
  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/ScrollTrigger.min.js"></script>

  <!-- pre-paint theme + skin boot: must run BEFORE styles apply so a saved
       dark theme or skin never flashes the wrong look on load (kept out of the
       PWA blocks, which build.js strips from standalone.html).

       Skin precedence: ?skin=… in the URL wins and is persisted, so a link can
       hand someone a specific look; otherwise the last saved skin is restored.
       ?skin=classic (or any unknown value) clears back to the default. -->
  <script>
    (function () {
      var el = document.documentElement;
      try {
        if (localStorage.getItem('europe-trip-theme-v1') === 'dark')
          el.setAttribute('data-theme', 'dark');
      } catch (e) {}
      try {
        var SKINS = ['pop', 'neon'];
        var q = new URLSearchParams(location.search).get('skin');
        var skin;
        if (q !== null) {
          skin = SKINS.indexOf(q) > -1 ? q : '';
          try { localStorage.setItem('europe-trip-skin-v1', skin); } catch (e) {}
        } else {
          skin = localStorage.getItem('europe-trip-skin-v1') || '';
          if (SKINS.indexOf(skin) < 0) skin = '';
        }
        if (skin) el.setAttribute('data-skin', skin);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=194">
</head>
<body>
  <main id="app"></main>
  <!-- SVG filter used by the day-plan map: dilates the white street lines so
       they read bolder (referenced from styles.css as url(#daymap-dilate)) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- app version: bolder street grid -->
    <filter id="daymap-dilate" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.75"/>
    </filter>
    <!-- web version: lighter grid so it doesn't crowd the street labels -->
    <filter id="daymap-dilate-soft" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.3"/>
    </filter>
  </svg>
  <!-- shared-post extractor (RedNote / TikTok / Instagram → itinerary rows);
       loads before app.js, which calls window.SocialImport -->
  <script src="social-import.js?v=1"></script>
  <script src="app.js?v=184"></script>
  <!-- PWA: offline cache + install support (no-op on file:// and non-secure origins) -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      // Reload once when a NEW service worker takes control, so a fresh deploy
      // shows up without a manual refresh. Guarded so it never fires on the
      // first install (no prior controller) and never loops.
      const hadController = !!navigator.serviceWorker.controller;
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing || !hadController) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        // updateViaCache:'none' → sw.js is always fetched from the network, so a
        // bumped VERSION is detected on the next load (not up to 24h later).
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update();   // check for a newer worker right away
          // installed PWAs seldom reload on their own — re-check whenever the app is refocused
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
